name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
          accept-android-sdk-licenses: true

      - name: Installer les dépendances
        run: bun install

      - name: Construire l'application web
        run: bun run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Préparer les fichiers web pour Capacitor
        run: |
          mkdir -p .output/public
          if [ ! -f .output/public/index.html ]; then
            cat > .output/public/index.html <<'HTML'
          <!doctype html>
          <html lang="ar">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <title>Eightfold Device Bridge</title>
            </head>
            <body>
              <p>جارٍ فتح التطبيق...</p>
            </body>
          </html>
          HTML
          fi

      - name: Créer le projet Android si absent
        run: |
          if [ ! -d android ]; then bunx cap add android; fi
          bunx cap sync android

      - name: Copier le plugin natif de capture d'écran
        run: |
          mkdir -p android/app/src/main/java/com/ayman/remote
          cp android-native/app/src/main/java/com/ayman/remote/*.kt android/app/src/main/java/com/ayman/remote/

      - name: Compiler l'APK de debug
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ayman-remote-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
