name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
          accept-android-sdk-licenses: true

      - name: Installer les dépendances
        run: bun install

      - name: Construire l'application web
        run: bun run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Préparer les fichiers web pour Capacitor
        run: |
          mkdir -p .output/public
          if [ ! -f .output/public/index.html ]; then
            cat > .output/public/index.html <<'HTML'
          <!doctype html>
          <html lang="fr">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <title>Ayman Remote</title>
            </head>
            <body>
              <p>Chargement d'Ayman Remote…</p>
            </body>
          </html>
          HTML
          fi

      - name: Générer et intégrer le pont Android natif
        run: |
          if [ ! -d android ]; then bunx cap add android; fi
          bunx cap sync android

          mkdir -p android/app/src/main/java/com/ayman/remote
          cp android-native/app/src/main/java/com/ayman/remote/*.kt android/app/src/main/java/com/ayman/remote/
          mkdir -p android/app/src/main/res/xml
          cp android-native/res/xml/ayman_remote_accessibility.xml android/app/src/main/res/xml/

          python3 - <<'PY'
          from pathlib import Path

          root_gradle = Path("android/build.gradle")
          root_text = root_gradle.read_text()
          if "kotlin-gradle-plugin" not in root_text:
              marker = "dependencies {"
              if marker not in root_text:
                  raise SystemExit("Could not locate root Gradle buildscript dependencies")
              root_text = root_text.replace(
                  marker,
                  marker + "\n        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.21'",
                  1,
              )
              root_gradle.write_text(root_text)

          app_gradle = Path("android/app/build.gradle")
          app_text = app_gradle.read_text()
          if "kotlin-android" not in app_text and "org.jetbrains.kotlin.android" not in app_text:
              marker = "android {"
              if marker not in app_text:
                  raise SystemExit("Could not locate Android app Gradle configuration")
              app_text = app_text.replace(marker, "apply plugin: 'kotlin-android'\n\n" + marker, 1)
          if "io.github.webrtc-sdk:android:" not in app_text:
              marker = "dependencies {"
              if marker not in app_text:
                  raise SystemExit("Could not locate Android app dependencies")
              app_text = app_text.replace(
                  marker,
                  marker + "\n    implementation 'io.github.webrtc-sdk:android:125.6422.07'",
                  1,
              )
          app_gradle.write_text(app_text)

          manifests = Path("android/app/src/main/AndroidManifest.xml")
          manifest = manifests.read_text()
          permissions = [
              '    <uses-permission android:name="android.permission.INTERNET" />',
              '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />',
              '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />',
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
          ]
          for permission in permissions:
              permission_name = permission.split('"')[1]
              if permission_name not in manifest:
                  manifest = manifest.replace("<application", permission + "\n    <application", 1)

          screen_service = '''        <service
                      android:name="com.ayman.remote.ScreenCaptureService"
                      android:exported="false"
                      android:foregroundServiceType="mediaProjection" />'''
          accessibility_service = '''        <service
                      android:name="com.ayman.remote.RemoteControlAccessibilityService"
                      android:label="Ayman Remote control"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">
                  <intent-filter>
                      <action android:name="android.accessibilityservice.AccessibilityService" />
                  </intent-filter>
                  <meta-data
                      android:name="android.accessibilityservice"
                      android:resource="@xml/ayman_remote_accessibility" />
              </service>'''
          if "com.ayman.remote.ScreenCaptureService" not in manifest:
              manifest = manifest.replace("</application>", screen_service + "\n    </application>", 1)
          if "com.ayman.remote.RemoteControlAccessibilityService" not in manifest:
              manifest = manifest.replace("</application>", accessibility_service + "\n    </application>", 1)
          manifests.write_text(manifest)

          main_files = list(Path("android/app/src/main/java").rglob("MainActivity.java"))
          if not main_files:
              raise SystemExit("Capacitor MainActivity.java was not generated")
          main = main_files[0]
          text = main.read_text()
          if "AymanScreenCapturePlugin" not in text:
              text = text.replace(
                  "import com.getcapacitor.BridgeActivity;",
                  "import com.getcapacitor.BridgeActivity;\nimport android.os.Bundle;\nimport com.ayman.remote.AymanScreenCapturePlugin;",
                  1,
              )
              text = text.replace(
                  "public class MainActivity extends BridgeActivity {}",
                  """public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(AymanScreenCapturePlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }""",
                  1,
              )
              if "registerPlugin(AymanScreenCapturePlugin.class)" not in text:
                  raise SystemExit("Could not register AymanScreenCapturePlugin in MainActivity")
              main.write_text(text)
          PY

      - name: Compiler l'APK Android
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ayman-remote-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
