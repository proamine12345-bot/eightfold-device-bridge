plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.proamine.eightfoldbridge'
    compileSdk 35

    defaultConfig {
        applicationId 'com.proamine.eightfoldbridge'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    // Make debug APK signing explicit so the APK produced by GitHub Actions
    // is installable on modern Android devices and remains compatible with
    // older supported Android versions.
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    signingConfigs {
        debug {
            enableV1Signing true
            enableV2Signing true
        }
    }
}
